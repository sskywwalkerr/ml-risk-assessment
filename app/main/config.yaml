app:
  debug: false

data:
  path: "data/raw"
  sample_size: null
  target_column: "label"

preprocessing:
  test_size: 0.2
  val_size: 0.125          # 12.5% от оставшихся -> итого 70/10/20
  random_state: 42
  nan_threshold: 0.5       # Удалить строки где >50% числовых колонок - NaN

models:
  save_path: "models"

  random_forest:
    classification:
      n_estimators: 200 # деревья
      max_depth: 20 # предел глубины дерева
      min_samples_split: 5 # минимальное количество объектов, необходимое для того, чтобы узел дерева мог разделиться на два дочерних
      n_jobs: -1 # Использование ядер процессора
      random_state: 42 # Фиксация случайности
      class_weight: "balanced" # баланс для редких классов
    regression:
      n_estimators: 200
      max_depth: 20
      min_samples_split: 5
      n_jobs: -1
      random_state: 42

  xgboost:
    classification:
      device: "cuda"
      n_estimators: 300
      max_depth: 8
      learning_rate: 0.05 # Скорость обучения (шаг градиента), меньше лучше результат
      subsample: 0.8 # Доля данных для обучения одного дерева
      colsample_bytree: 0.8 # Доля признаков (колонок) для одного дерева, лучшие признаки только из 80%
      eval_metric: "mlogloss" # Метрика качества, для более 2х классов
      n_jobs: -1 # Параллелизм
      random_state: 42
      verbosity: 0 # Отчеты
    regression:
      device: "cuda"
      n_estimators: 300
      max_depth: 8
      learning_rate: 0.05
      subsample: 0.8
      colsample_bytree: 0.8
      eval_metric: "rmse" # Среднеквадратичная ошибка
      n_jobs: -1
      random_state: 42
      verbosity: 0

  lightgbm:
    classification:
      device: "gpu"
      n_estimators: 300
      max_depth: 8
      learning_rate: 0.05
      subsample: 0.8
      colsample_bytree: 0.8
      min_child_samples: 50
      n_jobs: -1
      random_state: 42
      verbose: -1
    regression:
      device: "gpu"
      n_estimators: 300
      max_depth: 8
      learning_rate: 0.05
      subsample: 0.8
      colsample_bytree: 0.8
      n_jobs: -1
      random_state: 42
      verbose: -1

financial:
  currency: "RUB"
  usd_to_rub: 81.30

  base_costs_rub: # базовая стоимость атаки
    BenignTraffic: 0
    DDoS: 33_170_400       # $408k: $6k/мин * 68 мин
    DoS: 21_951_000        # $270k: $6k/мин * 45 мин
    Mirai: 417_069_000     # $5.13M: botnet/ransomware avg
    BruteForce: 391_053_000  # $4.81M: stolen credentials vector
    Web-based: 52_845_000  # $650k: $173/запись * ~3750 записей
    Recon: 4_065_000       # $50k: минимальный прямой ущерб от разведки
    Spoofing: 97_560_000   # $1.2M: MITM/ARP-spoofing

  # разбивка ущерба на категории, доли компонентов потерь "Cost categories"
  loss_weights:
    direct: 0.40           # прямые: Восстановление систем, IR-команда
    indirect: 0.30         # косвенные: Простой, отток клиентов
    reputation: 0.15       # репутационные: Репутационный ущерб
    regulatory: 0.15       # штрафы: Штрафы ФЗ-152

  # Множители времени обнаружения  "Time to identify by attack vector"
  # База: 150 дней = 1.0 (среднеотраслевое). Рекорд: 292 дня (BruteForce) 1
  detection_time_multiplier:
    BenignTraffic: 1.0
    Recon: 1.1             # ~60 дней - видно в логах сразу
    DDoS: 1.2              # ~90 дней
    DoS: 1.2               # ~90 дней
    Spoofing: 1.4          # ~150 дней
    Web-based: 1.5         # ~180 дней
    BruteForce: 1.8        # 292 дня - рекорд IBM
    Mirai: 2.0             # 300+ дней

  max_loss_rub: 813_000_000    # ~$10M * 81.30 - ограничение выбросов

  # Пороги уровней риска (RUB)
  risk_thresholds:
    critical: 81_300_000   # >= ~$1M
    high: 8_130_000        # >= ~$100K
    medium: 813_000        # >= ~$10K


results:
  path: "results"
  dpi: 150
  save_feature_importance: true
  save_confusion_matrix: true
  save_regression_analysis: true
