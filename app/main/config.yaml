app:
  debug: false

data:
  path: "data/raw"
  sample_size: null
  target_column: "label"

preprocessing:
  test_size: 0.2
  val_size: 0.125          # 12.5% от оставшихся -> итого 70/10/20
  random_state: 42
  nan_threshold: 0.5       # Удалить строки где >50% числовых колонок - NaN

models:
  save_path: "models"

  random_forest:
    classification:
      n_estimators: 200    # Количество деревьев в ансамбле
      max_depth: 20        # Предел глубины дерева
      min_samples_split: 5 # Минимальное количество объектов для разделения узла
      n_jobs: -1           # Использование всех ядер процессора
      random_state: 42     # Фиксация случайности для воспроизводимости
      class_weight: "balanced" # Балансировка весов для редких классов
    regression:
      n_estimators: 200
      max_depth: 20
      min_samples_split: 5
      n_jobs: -1
      random_state: 42

  xgboost:
    classification:
      device: "cuda"
      n_estimators: 300
      max_depth: 8
      learning_rate: 0.05  # Скорость обучения (шаг градиента), меньше — лучше результат
      subsample: 0.8       # Доля данных для обучения одного дерева
      colsample_bytree: 0.8 # Доля признаков для одного дерева (80% лучших)
      eval_metric: "mlogloss" # Метрика качества для многоклассовой задачи
      n_jobs: -1
      random_state: 42
      verbosity: 0         # Отключение подробного вывода
    regression:
      device: "cuda"
      n_estimators: 300
      max_depth: 8
      learning_rate: 0.05
      subsample: 0.8
      colsample_bytree: 0.8
      eval_metric: "rmse"  # Среднеквадратичная ошибка для регрессии
      n_jobs: -1
      random_state: 42
      verbosity: 0

  lightgbm:
    classification:
      device: "gpu"
      n_estimators: 300
      max_depth: 8
      learning_rate: 0.05
      subsample: 0.8
      colsample_bytree: 0.8
      min_child_samples: 50
      n_jobs: -1
      random_state: 42
      verbose: -1
    regression:
      device: "gpu"
      n_estimators: 300
      max_depth: 8
      learning_rate: 0.05
      subsample: 0.8
      colsample_bytree: 0.8
      n_jobs: -1
      random_state: 42
      verbose: -1

financial:
  currency: "RUB"
  usd_to_rub: 92.66

  base_costs_rub:
    BenignTraffic: 0

    DDoS: 21_682_440

    DoS: 25_018_200
    Mirai: 454_958_600

    BruteForce: 432_722_200

    Web-based: 60_000_000

    Recon: 4_633_000

    Spoofing: 111_960_000

  loss_weights:
    direct: 0.40
    indirect: 0.30
    reputation: 0.15
    regulatory: 0.15

  detection_time_multiplier:
    BenignTraffic: 1.0      # Базовое значение, угрозы нет
    Recon: 1.1              # Минуты/часы — быстро детектируется IDS/IPS [PT 2024]
    DDoS: 1.2               # 91% атак < 10 мин, авто-детектирование [Cloudflare Q4 2024]
    Spoofing: 1.4           # Требует анализа транзакций [ЦБ РФ 2025, экспертная оценка]
    DoS: 1.8                # 236 дней цикл, K = 236/267 * 2.0 [IBM 2025]
    Web-based: 1.8          # 245 дней цикл, K = 245/267 * 2.0 [IBM 2025]
    BruteForce: 1.8         # 246 дней цикл, K = 246/267 * 2.0 [IBM 2025]
    Mirai: 2.0              # 267 дней цикл — максимум, эталон [IBM 2025, Barracuda 2025]

  # Ограничение максимального ущерба для стабилизации дисперсии целевой переменной
  max_loss_rub: 10_000_000  # 10 млн руб. — порог CRITICAL по ГОСТ Р ИСО/МЭК 27005

  # Пороговые значения уровней риска (руб.)
  # Источник: ГОСТ Р ИСО/МЭК 27005-2010, адаптировано в рублях
  risk_thresholds:
    critical: 10_000_000    # >10 млн руб. - угроза непрерывности бизнеса
    high: 1_000_000         # 1-10 млн руб. - требует немедленного реагирования
    medium: 100_000         # 100 тыс. - 1 млн руб. — умеренный ущерб

results:
  path: "results"
  dpi: 150
  save_feature_importance: true
  save_confusion_matrix: true
  save_regression_analysis: true
