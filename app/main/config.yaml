app:
  debug: false

data:
  path: "data/raw"
  sample_size: null
  target_column: "label"

preprocessing:
  test_size: 0.2
  val_size: 0.125          # 12.5% от оставшихся -> итого 70/10/20
  random_state: 42
  nan_threshold: 0.5       # Удалить строки где >50% числовых колонок - NaN

models:
  save_path: "models"

  random_forest:
    classification:
      n_estimators: 200    # Количество деревьев в ансамбле
      max_depth: 20        # Предел глубины дерева
      min_samples_split: 5 # Минимальное количество объектов для разделения узла
      n_jobs: -1           # Использование всех ядер процессора
      random_state: 42     # Фиксация случайности для воспроизводимости
      class_weight: "balanced" # Балансировка весов для редких классов
    regression:
      n_estimators: 200
      max_depth: 20
      min_samples_split: 5
      n_jobs: -1
      random_state: 42

  xgboost:
    classification:
      device: "cuda"
      n_estimators: 300
      max_depth: 8
      learning_rate: 0.05  # Скорость обучения (шаг градиента), меньше — лучше результат
      subsample: 0.8       # Доля данных для обучения одного дерева
      colsample_bytree: 0.8 # Доля признаков для одного дерева (80% лучших)
      eval_metric: "mlogloss" # Метрика качества для многоклассовой задачи
      n_jobs: -1
      random_state: 42
      verbosity: 0         # Отключение подробного вывода
    regression:
      device: "cuda"
      n_estimators: 300
      max_depth: 8
      learning_rate: 0.05
      subsample: 0.8
      colsample_bytree: 0.8
      eval_metric: "rmse"  # Среднеквадратичная ошибка для регрессии
      n_jobs: -1
      random_state: 42
      verbosity: 0

  lightgbm:
    classification:
      device: "gpu"
      n_estimators: 300
      max_depth: 8
      learning_rate: 0.05
      subsample: 0.8
      colsample_bytree: 0.8
      min_child_samples: 50
      n_jobs: -1
      random_state: 42
      verbose: -1
    regression:
      device: "gpu"
      n_estimators: 300
      max_depth: 8
      learning_rate: 0.05
      subsample: 0.8
      colsample_bytree: 0.8
      n_jobs: -1
      random_state: 42
      verbose: -1

financial:
  currency: "RUB"
  usd_to_rub: 92.66

  base_costs_rub:
    BenignTraffic: 0

    DDoS: 21_682_440

    DoS: 25_018_200
    Mirai: 454_958_600

    BruteForce: 432_722_200

    Web-based: 60_000_000

    Recon: 4_633_000

    Spoofing: 111_960_000

  loss_weights:
    direct: 0.40
    indirect: 0.30
    reputation: 0.15
    regulatory: 0.15

  detection_time_multiplier:
    BenignTraffic: 1.0
    Recon: 1.1
    DDoS: 1.2
    Spoofing: 1.4
    DoS: 1.8
    Web-based: 1.8
    BruteForce: 1.8
    Mirai: 2.0

  max_loss_rub: 10_000_000


  risk_thresholds:
    critical: 10_000_000
    high: 1_000_000
    medium: 100_000

results:
  path: "results"
  dpi: 150
  save_feature_importance: true
  save_confusion_matrix: true
  save_regression_analysis: true
